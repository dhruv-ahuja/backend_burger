services:
  redis_burger: 
    image: redis:7.2.4
    container_name: redis_burger
    restart: unless-stopped
    command:
      - "--save 60 100"
      - "--save 300 50"
      - "--save 900 1"
      - "--appendonly yes"
      - "--requirepass ${REDIS_PASSWORD}"
    volumes:
      - ~/docker_data/redis:/data
    # env_file:
    #   - .env.backend_burger
    networks:
      - backend_burger_network 

  backend_burger: 
    image: dhruvahuja/backend_burger
    container_name: backend_burger
    restart: unless-stopped
    build:
      context: .
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION_NAME=${AWS_REGION_NAME}
      - SQS_QUEUE_NAME=${SQS_QUEUE_NAME}
      - S3_BUCKET_URL=${S3_BUCKET_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_LOGS_FOLDER=${S3_LOGS_FOLDER}
      - DB_URL=${DB_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_HOST=redis_burger
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_ENVIRONMENT=prod
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-backend_burger}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_RESOURCE_ATTRIBUTES="deployment.environment.name=prod,service.version=0.2.0"
    env_file:
      - .env
      # - .env.backend_burger
    ports:
      - "8000:8000"
    networks:
      - backend_burger_network
    depends_on:
      - redis_burger
    extra_hosts:
      # Map host.docker.internal to the host machine on Linux.
      - "host.docker.internal:host-gateway"
  
networks:
  backend_burger_network:
    name: backend_burger_network
