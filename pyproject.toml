[project]
name = "backend-burger"
version = "0.1.0"
description = "Backend API for Winter Orb"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apscheduler==3.10.4",
    "argon2-cffi==23.1.0",
    "beanie==1.26.0",
    "boto3==1.34.131",
    "certifi==2026.10.19",
    "fastapi==0.111.0",
    "gunicorn==22.0.0",
    "httpx==0.26.0",
    "loguru==0.7.2",
    "motor==3.3.1",
    "mypy-boto3-s3==1.28.55",
    "mypy-boto3-sqs==1.28.82",
    "numpy==2.0.0",
    "orjson==3.9.15",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "pandas==2.2.2",
    "passlib==1.7.4",
    "pip==26.2.2",
    "pydantic==2.7.4",
    "pydantic-settings==2.1.0",
    "pymongo==4.6.3",
    "python-dotenv==1.0.0",
    "python-jose==3.3.0",
    "python-multipart==0.0.9",
    "redis==5.0.1",
    "scikit-learn==1.5.0",
    "scipy==1.13.1",
    "setuptools==68.2.2",
    "statsmodels==0.14.2",
    "uvicorn==0.24.0.post1",
]

[dependency-groups]
dev = [
    "pyfakefs==5.3.2",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "ruff==0.1.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pyrefly]
project-includes = ["src"]
search-path = ["."]
