name: CI

on:
    push:
        branches: main
    pull_request:
        branches: main
    
    # allow manually triggering this workflow
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Tests use a disposable local replica set instead of depending on MongoDB Atlas.
    DB_URL: mongodb://localhost:27017/backendBurger?replicaSet=rs0&directConnection=true
    JWT_SECRET_KEY: ${{secrets.JWT_SECRET_KEY}}
    AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
    AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
    AWS_REGION_NAME: ${{secrets.AWS_REGION_NAME}}
    SQS_QUEUE_NAME: ${{secrets.SQS_QUEUE_NAME}}
    S3_BUCKET_URL: ${{secrets.S3_BUCKET_URL}}
    S3_BUCKET_NAME: ${{secrets.S3_BUCKET_NAME}}
    S3_LOGS_FOLDER: ${{secrets.S3_LOGS_FOLDER}}
    REDIS_HOST: localhost
    APP_ENVIRONMENT: github_workflow

jobs:
    build:
        timeout-minutes: 15
        runs-on: ubuntu-latest
        
        services:
            # Label used to access the service container
            redis:
                image: redis
                # Set health checks to wait until redis has started
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

                ports:
                    - 6379:6379

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Setup uv
              uses: astral-sh/setup-uv@v6
              with:
                version: "0.13.1"
                enable-cache: true
                cache-dependency-glob: "uv.lock"
            
            - name: Install PyCurl Dependencies
              run: 
                sudo apt-get update && sudo apt-get install -y curl libcurl4-openssl-dev build-essential libssl-dev

            - name: Install Dependencies
              run:
                uv sync --locked

            - name: Start MongoDB replica set
              run: |
                # A replica set is required by the application's transaction-backed routes.
                docker run --detach \
                  --name mongodb_burger \
                  --publish 27017:27017 \
                  mongodb/mongodb-community-server:7.0.2-ubuntu2204 \
                  --replSet rs0 --bind_ip_all

                for attempt in {1..30}; do
                  if docker exec mongodb_burger mongosh --quiet \
                    --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'; then
                    break
                  fi
                  sleep 1
                done

                docker exec mongodb_burger mongosh --quiet --eval \
                  'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'

                for attempt in {1..30}; do
                  if docker exec mongodb_burger mongosh --quiet \
                    --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
                    exit 0
                  fi
                  sleep 1
                done

                docker logs mongodb_burger
                exit 1
            
            - name: Test code
              run: 
                uv run pytest . -s -v -W ignore
            
            - name: Check Code Formatting
              run:
                uv run ruff format --line-length=120 --check .
            
            - name: Check Code Linting
              run: 
                uv run ruff check .
            
            - name: Setup Tmate Session
              if: ${{ failure() }}
              uses: mxschmitt/action-tmate@v3
